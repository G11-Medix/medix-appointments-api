services:

  traefik:
    image: traefik:v3.0

    container_name: medix_gateway

    environment:
      AI_SERVICE_URL: ${AI_SERVICE_URL}

    command:
      - "--api.dashboard=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - medix_gateway

    restart: unless-stopped


  nats:
    image: nats:2.10-alpine

    container_name: medix_nats

    command: ["-m", "8222"]

    expose:
      - "4222"
      - "8222"

    networks:
      - medix_net

    restart: unless-stopped


  medix_appointments_api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medix_appointments_api

    env_file:
      - ./.env

    environment:
      API_ROOT_PATH: /appointments
      IPS_ROUTES_JSON: >-
        {"2":{"base_url":"http://ips_santa_fe:4011","api_key":"ips-fsf-key"},"3":{"base_url":"http://ips_country:4012","api_key":"ips-cly-key"},"4":{"base_url":"http://ips_clinica_colombia:4013","api_key":"ips-cuc-key"},"5":{"base_url":"http://ips_san_ignacio:4014","api_key":"ips-hsi-key"},"6":{"base_url":"http://ips_mederi:4015","api_key":"ips-med-key"}}

      IPS_TIMEOUT_SECONDS: "10"
      NATS_ENABLED: "true"
      NATS_URL: nats://nats:4222
      NATS_CONNECT_MAX_ATTEMPTS: "30"
      NATS_CONNECT_RETRY_DELAY_SECONDS: "1"

    expose:
      - "8001"

    depends_on:
      - nats

    networks:
      - medix_net
      - medix_gateway

    restart: unless-stopped


  cloudflared:
    image: cloudflare/cloudflared:latest

    container_name: medix_cloudflared

    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}

    command: ${CLOUDFLARED_COMMAND:-tunnel --no-autoupdate --url http://traefik:80}

    networks:
      - medix_gateway

    depends_on:
      - traefik

    restart: unless-stopped


networks:

  medix_net:
    external: true

  medix_gateway:
    external: true


